[package]
name = "ds-pet"
version = "0.1.0"
edition = "2024"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[dependencies]
env_logger = "0.11"
log = "0.4"
muda = "0.21"
png = "0.18"
pollster = "0.4"
raw-window-handle = "0.6"
serde_json = "1"
tray-icon = "0.26"
wgpu = "29"
winit = "0.30"
fontdue = "0.9"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
zstd = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSEvent", "NSResponder", "NSApplication", "NSView", "NSMenu", "NSColor"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry"] }
