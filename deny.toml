# cargo-deny：依赖许可证 / 安全通告 / 重复版本 / 来源审计（CI 运行）

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# unmaintained 类（非漏洞），winit 依赖树带入且无升级路径
ignore = [
    "RUSTSEC-2024-0370", # proc-macro-error 失去维护
    "RUSTSEC-2026-0192", # ttf-parser 失去维护（→ skrifa）
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0", # option-ext（文件级弱 copyleft）
    "CC0-1.0",  # hexf-parse
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]
# 无许可证的依赖直接拒绝
confidence-threshold = 0.93
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
