name: Release

# Publishing: push a v* tag, or manual dispatch with a version input.
# Artifacts: macOS .app (signed zip), Windows zip (exe + assets), Linux tar.gz, SHA256 checksums.
# Frame assets are not stored in the repo; they are transcoded in CI from the upstream submodule.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (v0.1.0 or 0.1.0, required for manual dispatch)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            V="${{ inputs.version }}"
            if [[ -z "$V" ]]; then echo "manual dispatch requires the version input" >&2; exit 1; fi
            [[ "$V" == v* ]] || V="v$V"
            TAG="$V"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          PRE="${{ inputs.prerelease }}"
          echo "prerelease=${PRE:-false}" >> "$GITHUB_OUTPUT"

  assets:
    name: Preprocess frame assets
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install ffmpeg and zstd
        run: sudo apt-get update && sudo apt-get install -y ffmpeg zstd
      - name: Transcode with ffmpeg (keying, 320x180@15fps RGBA, zstd)
        run: scripts/preprocess_assets.sh
      - name: Package
        run: tar -cf assets.tar assets
      - uses: actions/upload-artifact@v7
        with:
          name: assets
          path: assets.tar
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false # caching is handled by rust-cache
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux window system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Download frame assets
        uses: actions/download-artifact@v8
        with:
          name: assets
      - name: Extract frame assets
        shell: bash
        run: tar -xf assets.tar
      - name: Fetch CJK font
        uses: ./.github/actions/fetch-cjk-font
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # ---------- macOS: .app (assemble, sign, notarize, zip) ----------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: scripts/package-macos.sh "${{ matrix.target }}" "$VERSION"

      # ---------- Windows: exe + assets in a zip ----------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Target "${{ matrix.target }}" -Version "$env:VERSION"

      # ---------- Linux: tar.gz ----------
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: scripts/package-linux.sh "${{ matrix.target }}" "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            ds-pet-*.zip
            ds-pet-*.tar.gz
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: macos-latest # provides shasum
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Guard against existing release (immutable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/releases/tags/${{ needs.prepare.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ needs.prepare.outputs.tag }} already exists; assets are immutable once published. Bump the version." >&2
            exit 1
          fi
      - name: Generate SHA256 checksums
        run: |
          cd dist
          shasum -a 256 ./*.zip ./*.tar.gz > "ds-pet-${{ needs.prepare.outputs.version }}-checksums-sha256.txt"
          ls -lh
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          overwrite_files: false
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ds-pet ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*checksums-sha256.txt
