name: Install Linux window system dependencies (cached)
description: >-
  安装编译需要的 Linux 桌面系统 dev 包。deb 下载用 actions/cache 复用；
  先按 runner 镜像自带的 apt 索引安装，失败再回退完整的 update + install。
  缓存键取本文件内容的哈希，改动包列表即自动换键。
runs:
  using: composite
  steps:
    - name: Cache apt archives
      uses: actions/cache@v6
      with:
        path: ~/apt-archives
        key: apt-${{ runner.os }}-${{ hashFiles('.github/actions/install-linux-deps/action.yml') }}
    - name: Install
      shell: bash
      run: |
        set -euo pipefail
        pkgs=(
          libx11-dev libxi-dev libxcursor-dev libxrandr-dev
          libxkbcommon-dev libwayland-dev libgtk-3-dev libasound2-dev
        )
        cache_dir="$HOME/apt-archives"
        mkdir -p "$cache_dir"
        # Point apt's download cache at the cached dir, so restored debs are
        # reused and fresh downloads land there for the next run. The dir lives
        # under $HOME, which the _apt sandbox user cannot write to, so downloads
        # run as root explicitly (apt would fall back to root with a warning).
        common_opts=(
          install -y --no-install-recommends
          -o "Dir::Cache::archives=$cache_dir"
          -o APT::Sandbox::User=root
        )
        if ! sudo apt-get "${common_opts[@]}" "${pkgs[@]}"; then
          echo "::warning::apt install without update failed, falling back to apt-get update"
          sudo apt-get update
          sudo apt-get "${common_opts[@]}" "${pkgs[@]}"
        fi
