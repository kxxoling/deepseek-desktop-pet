name: Install Linux packages (cached)
description: >-
  安装编译需要的 Linux 系统包（默认是桌面系统的 dev 包，可用 packages 输入换成别的，
  例如 ffmpeg zstd）。deb 下载用 actions/cache 复用；先按 runner 镜像自带的 apt 索引
  安装，失败再回退完整的 update + install。缓存键由包列表与本文件内容的哈希组成，
  任一变化即自动换键。
inputs:
  packages:
    description: 要安装的 deb 包列表（空格分隔）
    required: false
    default: libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libasound2-dev
runs:
  using: composite
  steps:
    - name: Cache apt archives
      uses: actions/cache@v6
      with:
        path: ~/apt-archives
        key: apt-${{ runner.os }}-${{ inputs.packages }}-${{ hashFiles('.github/actions/install-linux-deps/action.yml') }}
    - name: Install
      shell: bash
      run: |
        set -euo pipefail
        read -ra pkgs <<< "${{ inputs.packages }}"
        cache_dir="$HOME/apt-archives"
        mkdir -p "$cache_dir"
        # Point apt's download cache at the cached dir, so restored debs are
        # reused and fresh downloads land there for the next run. The dir lives
        # under $HOME, which the _apt sandbox user cannot write to, so downloads
        # run as root explicitly (apt would fall back to root with a warning).
        common_opts=(
          install -y --no-install-recommends
          -o "Dir::Cache::archives=$cache_dir"
          -o APT::Sandbox::User=root
        )
        if ! sudo apt-get "${common_opts[@]}" "${pkgs[@]}"; then
          echo "::warning::apt install without update failed, falling back to apt-get update"
          sudo apt-get update
          sudo apt-get "${common_opts[@]}" "${pkgs[@]}"
        fi
